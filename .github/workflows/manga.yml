# ══════════════════════════════════════════════════════════════════
# run.yml — 非公開リポジトリのコードを、ここで動かすだけ
# ══════════════════════════════════════════════════════════════════
#
# ■AIへ■ ★なぜこれが要るか★
#   GitHub Actions は
#     非公開リポジトリ 月2,000分（有限）
#     ★公開リポジトリ 無制限（無料）★
#   2026-09-08に非公開の枠を使い切り、全部の段取りが止まった。
#   ★ここは実行するだけの入れ物★ コードは非公開のまま。
#
# ■★★★ 絶対に守ること ★★★
#   ★公開リポジトリは、実行の記録も誰でも読める★
#     鍵は自動で伏せられるが、画面に出た文字はそのまま読める。
#   ★だから、出力は1文字も画面に出さない★
#     すべて > log.txt に逃がす。
#     エラーも 2>&1 で同じところへ。
#   ★エラーのときも中身を出さない★
#     「失敗しました」とだけ出す。理由は出さない。
#   ★ログをartifactとして残さない★ 誰でも取れてしまう。
#
# ■隠す必要があるもの／ないもの
#   隠す   Cloudflareの鍵 / GitHubのトークン / DMMのAPI ID /
#          Blueskyのパスワード / はてなのAPIキー
#          → すべてSecretsに入れる。GitHubが自動で伏せる。
#   隠さなくてよい
#          アフィリエイトID（サイトの全リンクに入っており既に公開）
#          サイトの住所（公開しているのだから当然）
name: manga-daily

on:
  # ★★★ GitHub の schedule（cron）は書かない ★★★（2026-09-13の決まり／2026-09-18に再確認）
  #   ■AIへ■ GitHub の schedule は間引かれて黙って止まる（2026-09-13まで実際に止まっていた）。
  #     時計は Cloudflare の duck-cron（30分ごと）だけ。それが /api/kick/daily で
  #     この workflow_dispatch を毎日 01:00（日本時間）に起こす。
  #     check_cron.py（門番）が「schedule: が無いこと」を確かめ、あれば配信を止める。
  #   ★2026-09-14 の直しで schedule が復活し、門番が「時計がおかしい」で止まり続けた★
  #     毎日2回（01:00 と 04:38）動いてもいた。ここに cron を足してはいけない。
  workflow_dispatch:

concurrency:
  group: manga-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 公開リポジトリは無制限なので長くてよい
    steps:
      # ★非公開リポジトリを取り出す★
      #   ■AIへ■ PRIVATE_TOKEN は「読み取りだけ」の細かい権限にすること。
      #     万一漏れても、書き換えられない。
      - uses: actions/checkout@v4
        with:
          repository: hoshiyomi-luna/uranai-luna
          token: ${{ secrets.SRC_TOKEN }}
          path: work

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 支度
        # ★★★ 動画づくりの道具はここで入れる ★★★（2026-09-17）
        #   ■AIへ■ GitHub の実行環境には ffmpeg が入っていない。
        #     duck_tool.py は ffprobe/ffmpeg で動画を組み立てるので、無いと
        #     「FileNotFoundError: 'ffprobe'」で★毎晩1本も作れない★
        #     （2026-09-13〜16、4晩×10回、そうなっていた。失敗は || true で隠れ、
        #       GitHub は success のままだった）。
        #   ★入れ忘れは次の「道具がそろっているか」で赤く止まる★
        run: |
          pip install -q requests pillow cryptography > /dev/null 2>&1
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null 2>&1 || true
          npm i -g wrangler > /dev/null 2>&1 || true
          echo "  支度しました"

      - name: 道具がそろっているか
        # ★★★ 無ければここで止める（|| true を付けない）★★★
        #   ■AIへ■ コメントを読まなくても止まる仕組み。
        #     道具が無いまま先へ進むと、失敗が写真のせいに数えられ、
        #     良い写真まで3回で外れる。作る前に環境の不備で止める。
        #   ★何が無いかだけ出す★ 鍵や中身は出さない。
        run: |
          ng=0
          for t in ffmpeg ffprobe; do
            if command -v "$t" > /dev/null 2>&1; then echo "  ○ $t"; else echo "  ★ $t がありません"; ng=1; fi
          done
          if python3 -c "import PIL, cryptography, requests" > /dev/null 2>&1; then
            echo "  ○ python の部品"
          else
            echo "  ★ python の部品（pillow/cryptography/requests）がありません"; ng=1
          fi
          if [ -s work/scripts/manga/assets/font.ttc ] || fc-list 2>/dev/null | grep -qi "Noto Sans CJK"; then
            echo "  ○ 日本語の文字"
          else
            echo "  ★ 日本語の文字（assets/font.ttc か Noto Sans CJK）がありません"; ng=1
          fi
          if [ "$ng" != "0" ]; then
            echo "★中止★ 道具がそろっていません。「支度」を直してください。"
            exit 1
          fi

      - name: GSCの鍵を置く
        # ★★★ gsc_key.json は .gitignore に入っている ★★★
        #   ■AIへ■ 非公開リポにも入っていないので、取り出せない。
        #     ★Secretsから書き出すこと★
        #     これが無いと Search Console の測定が動かない。
        #   ★中身は絶対に出さない★ サービスアカウントの秘密鍵。
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
        run: |
          cd work/scripts/manga 2>/dev/null || exit 0
          if [ -n "$GSC_KEY" ]; then
            printf '%s' "$GSC_KEY" > gsc_key.json
            echo "  ○ 置きました"
          else
            echo "  ★GSC_KEY がありません"
          fi

      - name: 鍵が生きているか確かめる
        # ★鍵そのものは出さない★ 公開リポなので記録は誰でも読める
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd work/scripts/manga
          python3 key_check.py > key.log 2>&1 || true
          # ★○×だけ出す★ 鍵の中身は出さない
          grep -cE "^  ○" key.log | xargs -I{} echo "  生きている鍵 {} 件"
          grep -cE "^  ★" key.log | xargs -I{} echo "  切れている鍵 {} 件"

      # ★★★ ここから出力は1文字も出さない ★★★
      # ★★動かす前に壊れていないか見る★★（2026-09-12）
      #   ■AIへ■ ★この点検を消すな★
      #     2026-09-12、字下げの崩れたファイルが送られ、
      #     気づかないまま実行されるところだった。
      #     文法が通らないファイルが1つでもあれば、その先は全部無駄になる。
      #   ★定義されていない名前も見る★
      #     HERE と HERE2 の取り違えで general 側が丸一日止まった。
      - name: 壊れていないか見る
        # ★取り出し先は work★（2026-09-12）
        #   ■AIへ■ src と書くな。checkout の path が work になっている。
        #     間違えると「作業場所が無い」で点検そのものが動かず、
        #     壊れたまま先へ進む。
        working-directory: work/scripts/manga
        run: |
          set +e
          python3 - <<'PYEOF'
          import ast, builtins, glob, sys
          ng = 0
          for f in sorted(glob.glob("*.py")):
              src = open(f, encoding="utf-8", errors="replace").read()
              try:
                  tree = ast.parse(src)
              except SyntaxError as e:
                  print("NG %s:%s %s" % (f, e.lineno, e.msg)); ng += 1; continue
              known = set(dir(builtins)) | {"__file__", "__name__", "__doc__"}
              for n in ast.walk(tree):
                  if isinstance(n, (ast.Import, ast.ImportFrom)):
                      for al in n.names:
                          known.add((al.asname or al.name).split(".")[0])
                  elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      known.add(n.name)
                      if not isinstance(n, ast.ClassDef):
                          ar = n.args
                          for x in ar.posonlyargs + ar.args + ar.kwonlyargs: known.add(x.arg)
                          if ar.vararg: known.add(ar.vararg.arg)
                          if ar.kwarg: known.add(ar.kwarg.arg)
                  elif isinstance(n, ast.Lambda):
                      ar = n.args
                      for x in ar.posonlyargs + ar.args + ar.kwonlyargs: known.add(x.arg)
                  elif isinstance(n, ast.Name) and isinstance(n.ctx, ast.Store):
                      known.add(n.id)
                  elif isinstance(n, ast.ExceptHandler) and n.name: known.add(n.name)
                  elif isinstance(n, (ast.Global, ast.Nonlocal)): known.update(n.names)
                  elif isinstance(n, ast.comprehension):
                      for t in ast.walk(n.target):
                          if isinstance(t, ast.Name): known.add(t.id)
              for n in ast.walk(tree):
                  if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load) and n.id not in known:
                      print("NG %s:%s 定義されていない名前 %s" % (f, n.lineno, n.id)); ng += 1
          print("check=%d" % ng)
          if ng: sys.exit(1)
          PYEOF

      - name: 更新
        env:
          MANGA_DATA_DIR: ${{ github.workspace }}/work/scripts/manga
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          # ★門番（check_cron.py）が GitHub のワークフローを読むための鍵★
          #   ■AIへ■ 2026-09-14 の直しでここから消え、門番が「鍵が無く schedule を
          #     確かめられません」で止まり続けた。読み取り専用の細かい権限の鍵でよい。
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd work/scripts/manga
          # ★控えを戻す★
          for f in ../../data/manga/*.json ../../data/manga/*.jsonl; do
            cp -f "$f" . 2>/dev/null || true
          done
          for g in ../../data/manga/*.gz; do
            case "$g" in *.tar.gz) tar xzf "$g" 2>/dev/null || true ;;
              *) gunzip -c "$g" > "$(basename "${g%.gz}")" 2>/dev/null || true ;;
            esac
          done
          # ★★★ 出力を全部ファイルへ逃がす ★★★
          #   ■AIへ■ ここで画面に出すと、誰でも読める。
          set +e
          # ★★途中経過が見えるようにする★★（2026-09-10）
          #   ■AIへ■ ★中身を隠すのと、進み具合を隠すのは別★
          #   前は全部 run.log へ逃がしていたので、終わるまで何も分からず、
          #   失敗しても中身が読めなかった。丸一日それで潰した。
          #   ★段階の名前だけを画面に出す★
          #     「5/5 サイトごとに生成して配信」のような行は、
          #     作品名も件数も含まないので、公開されても困らない。
          #   ★件数・作品名・IDが入る行は出さない★ 数字を含む行は伏せる。
          python3 auto_daily.py 2>&1 | tee run.log | \
            grep -E '^\[[0-9:]+\] [0-9]/[0-9] |^\[[0-9:]+\] 完了|★' | \
            sed -E 's/[0-9]{3,}/…/g' || true
          # ★tee を挟んだので $? は grep の結果になる★
          #   本体の成否は PIPESTATUS[0] で取る。ここを間違えると常に0になる。
          echo ${PIPESTATUS[0]} > run.code
          set -e
          echo "  更新しました"

      - name: アヒル動画を1本補充する
        # ★★★ 予約が尽きないように毎日1本作る ★★★
        #   ■AIへ■ ★前の工程が失敗しても必ず動く★
        #     予約は毎日1本ずつ減る。数日止まると尽きる。
        #     動画作りは在庫の更新と関係が無いので、独立して動かす。
        #   ★出力はファイルへ★ 合言葉が漏れる。
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd work/scripts/manga 2>/dev/null || exit 0
          # ★★★ 作る前に、本番の保管庫から動画と写真を取り戻す ★★★
          #   ■AIへ■ 動画・写真は .gitignore なので、ここには元から無い。
          #     取り戻さないと「写真が無く作れません」で毎晩1本も作れず、
          #     保管庫の配信も「動画0本」で止まる（2026-09-13まで実際にそうだった）。
          #     ★保管庫（imadake-duck.pages.dev）が材料の本物置き場★
          timeout 600 python3 duck_restore.py > restore.log 2>&1 || true
          tail -1 restore.log | sed -E 's/[0-9]{3,}/…/g'
          # ★切り抜きだけ足す★ 写真が戻ってから作る。
          #   ■AIへ■ ★stock_order.py を引数なしで呼んではいけない★
          #     それは並びを一から作り直す。写真に紐づく作品・合言葉が
          #     毎晩変わってしまう。--cuts-only は並びを変えない。
          timeout 300 python3 stock_order.py --cuts-only 2>&1 | tail -1 || true
          # ★★★ 作る前に「保管庫へ送れる環境か」を確かめる ★★★（2026-09-19）
          #   ■AIへ■ 昨夜、動画を作った後で保管庫へ送れず、動画が消えて予約だけ残った
          #     （こなゆき）。送れない環境なら作る前に止める。既存の動画・投稿文が
          #     全部そろっているか、鍵と wrangler が使えるかが、ここで分かる。
          timeout 900 python3 duck_vault.py > vault_pre.log 2>&1 || true
          if grep -qE "Success!|配信しました" vault_pre.log; then
            echo "  ○ 保管庫へ送れる環境です（既存の分を送り直しました）"
          else
            echo "★中止★ 保管庫へ送れない環境なので、今夜は作りません（動画が消えるのを防ぐ）"
            tail -5 vault_pre.log | sed -E 's/[0-9]{3,}/…/g'
            cp -f vault_pre.log vault.log
            exit 1
          fi
          # ★daily_duck.py が最初に素材庫を点検（stock_order.repair）してから1本作る★
          #   ■AIへ■ 使用済み・著作権アウト・同じ絵柄・切り抜けない行を外し、
          #     合言葉の重複・使用済みを付け直す。順番と写真↔作品の組は変えない。
          timeout 1200 python3 daily_duck.py --n 1 > duck.log 2>&1 || true
          # ★★★ 予約が抜けていたら埋める ★★★
          #   ■AIへ■ 手で作った動画や、途中で止まった日の動画には
          #     予約が付いていないことがある（2026-09-13に実際にあった）。
          #     ★7日先まで1日1本になるよう、空いている日に足す★
          #     すでにある予約には触らない。
          timeout 300 python3 fix_sched.py --days 7 2>&1 | tail -3 || true
          if grep -q "作った動画 1 本" duck.log; then
            echo "  ○ 1本作りました"
            # ★★★ 作った動画を保管庫（imadake-duck）へ上げる ★★★（2026-09-18）
            #   ■AIへ■ mp4 は .gitignore で持ち帰られない。ここで保管庫へ送らないと
            #     実行が終わった時点で動画が消え、予約だけが残る（実際にそうなっていた）。
            #     前は auto_daily が「本体の配信が門番を通った後」にだけ送っていた。
            timeout 900 python3 duck_vault.py > vault.log 2>&1 || true
            if grep -qE "Success!|送りました|配信しました" vault.log; then
              echo "  ○ 保管庫へ送りました"
            else
              echo "★中止★ 保管庫へ送れませんでした（動画が本番に残りません）"
              tail -3 vault.log | sed -E 's/[0-9]{3,}/…/g'
              exit 1
            fi
          else
            echo "  ★作れませんでした（中身は出しません）"
            # ★1本も作れなかった夜は赤くする★ 予約は毎日1本ずつ減る。黙って success にしない。
            _ng=1
          fi
          # ★★★ 環境の不備は隠さない ★★★（2026-09-17）
          #   ■AIへ■ 道具・部品が無い失敗は、この工程を赤くする（|| true で飲まない）。
          #     ただし記録の持ち帰りは if: always() なので、ログは非公開リポに残る。
          if grep -qE "ffprobe|ffmpeg|cannot open resource|No module named|道具が無い" duck.log; then
            echo "★中止★ 道具が無くて作れませんでした。「支度」を確かめてください。"
            exit 1
          fi
          if [ "${_ng:-0}" = "1" ]; then
            echo "★中止★ 今夜は1本も作れませんでした。duck.txt（非公開リポ runlog）を見てください。"
            exit 1
          fi

      - name: 記録を持ち帰る
        # ★★★ 作ったものを非公開リポへ戻す ★★★
        #   ■AIへ■ ★これが無いと、明日ゼロからやり直しになる★
        #     公開リポは毎回まっさら。取り出した work/ は消える。
        #   ★出力は出さない★ URLに鍵が入っている。
        if: always()
        env:
          GH: ${{ secrets.SRC_TOKEN }}
        run: |
          cd work 2>/dev/null || exit 0
          # ★ログを非公開リポへ残す★
          #   ■AIへ■ 公開側に出せない理由を、ここで確かめられるように。
          # ★ログは .gitignore で外れる★
          #   ■AIへ■ logs / *.log が無視されている。
          #     ★拡張子を .txt にして残すこと★
          #     これが無いと、失敗の理由が一生分からない。
          mkdir -p runlog
          # ★★★ 途中の記録を控え（data/manga）へ写してから保存する ★★★（2026-09-21）
          #   ■AIへ■ 「更新」の最初で data/manga/*.json を scripts/manga へ戻す。
          #     でも終わりに scripts/manga → data/manga へ写していなかった。
          #     だから素材庫は毎晩 468 行の古い控えに戻り、点検が毎晩同じ 253 行を外し、
          #     台帳の purged も戻り、保管庫の守りが「動画が無い」で止まり続けた
          #     （2026-09-20・21 に実測）。ここで必ず写す。
          for f in duck_ledger.json stock_order.json photo_password.json \
                   photo_password_dropped.json purged.json make_fail.json \
                   secret_blocks.jsonl secret_works.json passwords.json \
                   phash.json face_cache.json; do
            cp -f "scripts/manga/$f" "data/manga/$f" 2>/dev/null || true
          done
          # ★★★ 秘密ページの控え（secret_out.tar.gz）も毎晩取り直す ★★★（2026-09-22）
          #   ■AIへ■ この控えは 9/13 に1回作ったきりで、更新の最初に毎晩展開される。
          #     だから門番は毎晩 9/13 の works.json（作品リンク）を見て「13件開けない」と
          #     止め続けた。daily_duck が引き直した新しい秘密ページを、ここで控えに写す。
          #     動画と絵の元（mp4/png）は保管庫にあるので入れない（大きい）。
          if [ -d scripts/manga/secret_out/secret ]; then
            tar czf data/manga/secret_out.tar.gz -C scripts/manga \
                --exclude='*.mp4' --exclude='*.png' secret_out 2>/dev/null || true
          fi
          for f in scripts/manga/run.log scripts/manga/duck.log \
                   scripts/manga/key.log scripts/manga/vault.log; do
            b=$(basename "$f" .log)
            [ -f "$f" ] && tail -c 200000 "$f" > "runlog/${b}.txt" || true
          done
          git add -f runlog > /dev/null 2>&1 || true
          git config user.name "runner"
          git config user.email "runner@local"
          rm -rf scripts/manga/site_general scripts/manga/site_adult \
                 scripts/manga/deploy_* > /dev/null 2>&1 || true
          # ★★★ 持ち帰りは黙って失敗させない ★★★
          #   ■AIへ■ ★2026-09-13に見つけた最悪の不具合★
          #     すべてを > /dev/null 2>&1 || true で隠していたため、
          #     ★在庫の控えが9/8から5日間まったく保存されていなかった★。
          #     GitHubは success と出るので誰も気づけない。
          #     新着を毎日取っているのに、翌日には消えていた。
          #     実測：DMMの新着795件のうち★758件が在庫に無い★。
          #   ★出力を隠さない。失敗したら exit 1 で赤くする★
          echo "── 持ち帰り ──"
          _before=$(git rev-parse HEAD)
          git stash -u || echo "（退避なし）"
          git pull --rebase origin main || echo "★取り込みに失敗"
          git stash pop || echo "（戻すものなし）"
          git add -A
          if git diff --cached --quiet; then
            echo "★中止★ 保存するものがありません（在庫が作られていない）"
            exit 1
          fi
          git commit -q -m "daily $(date -u +%F)"
          if git push "https://x-access-token:${GH}@github.com/hoshiyomi-luna/uranai-luna.git" HEAD:main; then
            echo "  ○ 持ち帰りました"
          else
            echo "★中止★ 持ち帰れませんでした（在庫が翌日に残りません）"
            exit 1
          fi
          # ★★★ 在庫の控えが本当に新しくなったか確かめる ★★★
          #   ■AIへ■ push が通っても、控えが古いままなら意味がない。
          #     ★中身を見て確かめる★
          _n=$(git log -1 --name-only --format= | grep -c "stock_full.jsonl.gz" || echo 0)
          if [ "$_n" = "0" ]; then
            echo "★中止★ 在庫の控えが保存されていません"
            exit 1
          fi
          echo "  ○ 在庫の控えも保存しました"

      - name: 結果
        if: always()
        run: |
          cd work/scripts/manga 2>/dev/null || exit 0
          c=$(cat run.code 2>/dev/null || echo 1)
          if [ "$c" = "0" ]; then
            echo "  ○ 成功しました"
          else
            # ★★★ 理由は非公開リポにだけ残す ★★★
            #   ■AIへ■ 画面に出すと誰でも読める。
            #     でも理由が分からないと直せない。
            #     ★ログを非公開リポへ持ち帰る★（記録を持ち帰る工程）
            #     画面には「何行目で止まったか」だけ出す。
            #     行番号だけなら、中身は分からない。
            n=$(wc -l < run.log 2>/dev/null || echo 0)
            echo "  ★失敗しました（ログ ${n} 行。中身は非公開リポへ）"
            exit 1
          fi
