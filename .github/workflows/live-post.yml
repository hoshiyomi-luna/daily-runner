# ============================================================
# ライブチャットのお知らせをBlueskyへ出す（30分ごとに見回る）
#
# ★なぜ公開リポジトリにあるか★
#   非公開リポジトリの実行時間は月2,000分で、既に使い切っている。
#   公開リポジトリは標準の実行環境なら無制限で無料。
#   ★コードは非公開のまま★ ここには何も置かない。
#
# ★なぜGitHubで動かすか★
#   投稿の直前にサイトの画面を撮る。ブラウザが要るのでWorkerでは動かない。
#
# ★起動はWorkerから★
#   GitHubの定期実行は当てにならない（実測: 7時間半で1回）。
#   shirouto-proxy（Cloudflare）が30分ごとに叩く。
#
# ★出力は隠す★ 公開リポジトリは実行の記録も誰でも読める。
#   ただし成否だけは残す（隠しすぎて失敗に気づけなかった反省）。
# ============================================================
name: live-post
on:
  workflow_dispatch:
concurrency:
  group: live-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hoshiyomi-luna/shirouto-douga
          token: ${{ secrets.SRC_TOKEN }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: したく
        working-directory: src
        run: |
          set +e
          pip install -q requests pillow playwright > /dev/null 2>&1
          python3 -m playwright install chromium > /dev/null 2>&1
          echo "ok"

      - name: お知らせを出す
        working-directory: src
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PW: ${{ secrets.BLUESKY_APP_PW }}
        run: |
          set +e
          python3 live_post.py --post >> live.log 2>&1
          echo "live=$?"

      - name: 記録を持ち帰る
        if: always()
        working-directory: src
        env:
          GH: ${{ secrets.SRC_TOKEN }}
        run: |
          set +e
          mkdir -p logs
          tail -c 30000 live.log > logs/live.txt 2>/dev/null
          git config user.name "runner"
          git config user.email "runner@local"
          git stash -u > /dev/null 2>&1
          git pull --rebase -q origin main > /dev/null 2>&1
          git stash pop > /dev/null 2>&1
          git add logs/live.txt live_post_state.json > /dev/null 2>&1
          git diff --cached --quiet || git commit -q -m "live $(date -u +%F_%H%M)" > /dev/null 2>&1
          git push -q "https://x-access-token:${GH}@github.com/hoshiyomi-luna/shirouto-douga.git" HEAD:main > /dev/null 2>&1
          echo "done"
