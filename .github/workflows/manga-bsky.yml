# ============================================================
# 今だけ無料マンガ の Bluesky ほか（30分ごと）
#
# ★なぜここ（公開リポジトリ）にあるか★
#   非公開リポジトリは月2,000分しか使えず、2026-09-08に使い切った。
#   公開リポジトリは標準の実行環境なら無制限で無料。
#   ★コードは非公開のまま★ ここには何も置かない。取り出して動かすだけ。
#
# ★元は uranai-luna の .github/workflows/bsky.yml★
#   移行のときにこれだけ漏れていて、Blueskyが止まっていた（2026-09-09に発見）。
#   中身は元と同じ。checkout の仕方と、出力を隠す点だけが違う。
#
# ★公開リポジトリは実行の記録も誰でも読める★
#   投稿の中身・件数・IDが見えると困るので、中身はファイルへ逃がす。
#   記録は非公開リポジトリ側へ git で持ち帰る。
#
# ★★中身を隠すのと、失敗を隠すのは別★★（2026-09-09に直した）
#   最初は「> /dev/null 2>&1 || true」と書いた。
#   これだと中で全部こけても画面には success と出る。
#   ★確かめようのない作りになっていた★
#   → 中身はファイルへ、終了コードだけ bsky.code に残す。
#     画面には「post=0 like=0」のような数字だけを出す。
#     0 なら正常。0 以外なら、その段階が失敗している。
# ============================================================
name: manga-bsky
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: manga-bsky
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hoshiyomi-luna/uranai-luna
          token: ${{ secrets.SRC_TOKEN }}
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: したく
        run: pip install -q requests pillow cryptography > /dev/null 2>&1 || true

      - name: データを戻す
        run: |
          cd work/scripts/manga
          for f in sns_posted.json follow_state.json reply_state.json \
                   bsky_posted.json bsky_session.json bsky_hours.json \
                   hatena_posted.json hatena_series_done.json \
                   hatena_seo.json gsc_key.json like_score.json \
                   items_general.json; do
            cp -f ../../data/manga/$f . 2>/dev/null || true
          done
          if [ -f ../../data/manga/browser_general.tar.gz ]; then
            tar xzf ../../data/manga/browser_general.tar.gz
          fi

      - name: 反応の多い時間を測り直す（月に1回・1日の朝）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          cd work/scripts/manga
          if [ "$(TZ=Asia/Tokyo date +%d)" = "01" ] && [ "$(TZ=Asia/Tokyo date +%H)" = "05" ]; then
            timeout 300 python3 bsky_hours.py --apply > /dev/null 2>&1 || true
          fi

      - name: アヒル動画の自動投稿
        run: curl -s --max-time 300 "https://imadake-duck.pages.dev/api/run" > /dev/null 2>&1 || true

      - name: 投稿
        run: |
          cd work/scripts/manga
          python3 bluesky.py --auto >> bsky.log 2>&1; echo "post=$?" >> bsky.code

      - name: はてなブログに1本出す
        run: |
          cd work/scripts/manga
          timeout 180 python3 hatena_post.py --run >> bsky.log 2>&1; echo "hatena=$?" >> bsky.code

      - name: 何巻まで無料の記事
        run: |
          cd work/scripts/manga
          if [ ! -f .series_$(TZ=Asia/Tokyo date +%F) ]; then
            timeout 180 python3 hatena_series.py --run > /dev/null 2>&1 && \
              touch .series_$(TZ=Asia/Tokyo date +%F) || true
          fi

      - name: 返信
        run: |
          cd work/scripts/manga
          timeout 600 python3 bsky_reply.py --run >> bsky.log 2>&1; echo "reply=$?" >> bsky.code

      - name: いいね回り
        run: |
          cd work/scripts/manga
          timeout 600 python3 bsky_follow.py --like >> bsky.log 2>&1; echo "like=$?" >> bsky.code

      - name: フォロー
        run: |
          cd work/scripts/manga
          timeout 300 python3 bsky_follow.py --run >> bsky.log 2>&1; echo "follow=$?" >> bsky.code

      - name: 言葉ごとのフォロバ率
        run: |
          cd work/scripts/manga
          if [ ! -f .score_$(TZ=Asia/Tokyo date +%F) ]; then
            timeout 300 python3 bsky_follow.py --score > /dev/null 2>&1 && \
              touch .score_$(TZ=Asia/Tokyo date +%F) || true
          fi

      - name: 返ってこない人を外す
        run: |
          cd work/scripts/manga
          timeout 300 python3 bsky_follow.py --cleanup >> bsky.log 2>&1; echo "cleanup=$?" >> bsky.code

      - name: 成否をまとめる
        if: always()
        run: |
          cd work/scripts/manga
          # ★中身は出さない。終了コードだけ★
          tr '\n' ' ' < bsky.code 2>/dev/null || echo "code-none"
          if grep -qv '=0$' bsky.code 2>/dev/null; then echo "ng"; else echo "ok"; fi

      - name: 記録を持ち帰る
        if: always()
        env:
          GH: ${{ secrets.SRC_TOKEN }}
        run: |
          cd work/scripts/manga
          for f in sns_posted.json follow_state.json reply_state.json \
                   bsky_posted.json bsky_session.json bsky_hours.json \
                   hatena_posted.json hatena_series_done.json \
                   hatena_seo.json like_score.json; do
            cp -f $f ../../data/manga/ 2>/dev/null || true
          done
          # ★失敗の中身は非公開側の記録へ★ 公開側には出さない
          mkdir -p ../../runlog
          tail -c 60000 bsky.log > ../../runlog/bsky.txt 2>/dev/null || true
          cp -f bsky.code ../../runlog/bsky.code 2>/dev/null || true
          cd ..
          cd ..
          git config user.name "duck"
          git config user.email "duck@imadake.local"
          mkdir -p /tmp/keep
          cp -f data/manga/*.json /tmp/keep/ > /dev/null 2>&1 || true
          git checkout -- . > /dev/null 2>&1 || true
          git pull --rebase -q origin main > /dev/null 2>&1 || true
          cp -f /tmp/keep/*.json data/manga/ > /dev/null 2>&1 || true
          git add data/manga/ runlog/ > /dev/null 2>&1 || true
          git diff --cached --quiet || git commit -q -m "bsky: $(date +%F_%H%M)" > /dev/null 2>&1 || true
          git push -q "https://x-access-token:${GH}@github.com/hoshiyomi-luna/uranai-luna.git" HEAD:main > /dev/null 2>&1 \
            && echo "ok" || echo "check"
