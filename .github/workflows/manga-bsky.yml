# ============================================================
# 今だけ無料マンガ の Bluesky ほか（30分ごと）
#
# ★なぜここ（公開リポジトリ）にあるか★
#   非公開リポジトリは月2,000分しか使えず、2026-09-08に使い切った。
#   公開リポジトリは標準の実行環境なら無制限で無料。
#   ★コードは非公開のまま★ ここには何も置かない。取り出して動かすだけ。
#
# ★元は uranai-luna の .github/workflows/bsky.yml★
#   移行のときにこれだけ漏れていて、Blueskyが止まっていた（2026-09-09に発見）。
#   中身は元と同じ。checkout の仕方と、出力を隠す点だけが違う。
#
# ★公開リポジトリは実行の記録も誰でも読める★
#   投稿の中身・件数・IDが見えると困るので、中身はファイルへ逃がす。
#   記録は非公開リポジトリ側へ git で持ち帰る。
#
# ★★中身を隠すのと、失敗を隠すのは別★★（2026-09-09に直した）
#   最初は「> /dev/null 2>&1 || true」と書いた。
#   これだと中で全部こけても画面には success と出る。
#   ★確かめようのない作りになっていた★
#   → 中身はファイルへ、終了コードだけ bsky.code に残す。
#
# ★★set +e を必ず書く★★（2026-09-09に判明）
#   GitHubの run: は既定で「bash -e」で動く。
#   コマンドが0以外を返した瞬間、その段階が終わる。
#   そのせいで「124なら0にする」処理が一度も実行されず、
#   bsky.code に like= と follow= が記録されなかった。
#   ★手前で打ち切られていた★
#
# ★★時間切れ(124)を異常扱いするな★★（2026-09-09に直した）
#   いいねは1件40〜86秒待つ。600秒では終わらないので必ず時間切れになる。
#   元の設定に「|| true」が付いていたのは、これを承知の上だった。
#   ★それを「失敗を隠している」と誤解して外し、後続を全部止めた★
#   → 124だけ正常扱いにする。他の異常は残す。
# ★1つ失敗しても後続を止めない★ if: always() を全段階に付ける。
#     画面には「post=0 like=0」のような数字だけを出す。
#     0 なら正常。0 以外なら、その段階が失敗している。
# ============================================================
name: manga-bsky
on:
  # ★時計は Cloudflare（duck-cron）★
  #   ■AIへ■ GitHubの schedule は間引かれるので使わない。
  #     Cloudflare の時計が /api/kick/daily を呼び、workflow_dispatch で起こす。
  workflow_dispatch:
concurrency:
  group: manga-bsky
  cancel-in-progress: false

jobs:
  # ★★★ 同じ30分枠で2回目なら、何もしない ★★★（2026-09-19）
  #   ■AIへ■ 時計が2つある（duck-cron→/api/bsky/kick と shirouto-proxy の cron）。
  #     どちらも毎30分にこの workflow を起こすので、9/15から毎回2回動いていた
  #     （順番待ちで連続実行、時々 cancelled）。shirouto-proxy の元コードは
  #     どのリポにも無く直せないので、受け口のここで弾く。
  #   ★25分以内に自分以外の起動があれば dup=1★ 正しい次の起動は30分後なので通る。
  #   ★この門は絶対に失敗させない★（失敗すると本体が飛ばされる）。取れなければ dup=0。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dup: ${{ steps.d.outputs.dup }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          dup=0
          curl -s --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manga-bsky.yml/runs?per_page=8" \
               -o /tmp/runs.json
          cat > /tmp/dup.py <<'PY'
          import sys, json, datetime
          me, path = sys.argv[1], sys.argv[2]
          try:
              runs = json.load(open(path)).get("workflow_runs", [])
          except Exception:
              print(0); raise SystemExit
          def _t(r):
              return datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
          mine = next((r for r in runs if str(r.get("id")) == me), None)
          my_t = _t(mine) if mine else datetime.datetime.now(datetime.timezone.utc)
          my_id = int(me) if me.isdigit() else 0
          # ★自分より前に起きた（同時刻なら番号が小さい）ものだけ見る★
          #   後から起きた方を見ると、1回目も「2回目がある」と思って両方止まる（手元で実測）。
          for r in runs:
              if str(r.get("id")) == me:
                  continue
              if r.get("conclusion") not in (None, "success"):
                  continue                       # cancelled/failure は数えない
              t = _t(r)
              earlier = t < my_t or (t == my_t and int(r.get("id", 0)) < my_id)
              if earlier and (my_t - t).total_seconds() < 25 * 60:
                  print(1); raise SystemExit
          print(0)
          PY
          dup=$(python3 /tmp/dup.py "$GITHUB_RUN_ID" /tmp/runs.json 2>/dev/null || echo 0)
          case "$dup" in 1) ;; *) dup=0 ;; esac
          echo "dup=$dup" >> "$GITHUB_OUTPUT"
          if [ "$dup" = "1" ]; then echo "  同じ30分枠の2回目なので、今回は何もしません"; else echo "  今回が枠の1回目です"; fi

  run:
    needs: check
    if: needs.check.outputs.dup != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hoshiyomi-luna/uranai-luna
          token: ${{ secrets.SRC_TOKEN }}
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: したく
        run: pip install -q requests pillow cryptography > /dev/null 2>&1 || true

      - name: データを戻す
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          for f in sns_posted.json follow_state.json reply_state.json \
                   bsky_posted.json bsky_session.json bsky_hours.json \
                   hatena_posted.json hatena_series_done.json \
                   hatena_seo.json gsc_key.json like_score.json \
                   items_general.json; do
            cp -f ../../data/manga/$f . 2>/dev/null || true
          done
          if [ -f ../../data/manga/browser_general.tar.gz ]; then
            tar xzf ../../data/manga/browser_general.tar.gz
          fi

      - name: 反応の多い時間を測り直す（月に1回・1日の朝）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          if [ "$(TZ=Asia/Tokyo date +%d)" = "01" ] && [ "$(TZ=Asia/Tokyo date +%H)" = "05" ]; then
            timeout 300 python3 bsky_hours.py --apply > /dev/null 2>&1 || true
          fi

      - name: アヒル動画の自動投稿
        run: curl -s --max-time 300 "https://imadake-duck.pages.dev/api/run" > /dev/null 2>&1 || true

      - name: 投稿
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          python3 bluesky.py --auto >> bsky.log 2>&1; echo "post=$?" >> bsky.code

      - name: はてなブログに1本出す
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          timeout 180 python3 hatena_post.py --run >> bsky.log 2>&1; echo "hatena=$?" >> bsky.code

      - name: 何巻まで無料の記事
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          if [ ! -f .series_$(TZ=Asia/Tokyo date +%F) ]; then
            timeout 180 python3 hatena_series.py --run > /dev/null 2>&1 && \
              touch .series_$(TZ=Asia/Tokyo date +%F) || true
          fi

      - name: 返信
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          timeout 600 python3 bsky_reply.py --run >> bsky.log 2>&1; c=$?
          [ $c -eq 124 ] && c=0
          echo "reply=$c" >> bsky.code

      - name: いいね回り
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          timeout 600 python3 bsky_follow.py --like >> bsky.log 2>&1; c=$?
          # ★124は時間切れ★ いいねは1件40〜86秒待つので600秒では終わらない。
          #   途中まで進んでいれば正常。異常扱いにしない。
          [ $c -eq 124 ] && c=0
          echo "like=$c" >> bsky.code

      - name: フォロー
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          timeout 300 python3 bsky_follow.py --run >> bsky.log 2>&1; c=$?
          [ $c -eq 124 ] && c=0
          echo "follow=$c" >> bsky.code

      - name: 言葉ごとのフォロバ率
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          if [ ! -f .score_$(TZ=Asia/Tokyo date +%F) ]; then
            timeout 300 python3 bsky_follow.py --score > /dev/null 2>&1 && \
              touch .score_$(TZ=Asia/Tokyo date +%F) || true
          fi

      - name: 返ってこない人を外す
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          timeout 300 python3 bsky_follow.py --cleanup >> bsky.log 2>&1; c=$?
          [ $c -eq 124 ] && c=0
          echo "cleanup=$c" >> bsky.code

      - name: 成否をまとめる
        if: always()
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          # ★中身は出さない。終了コードだけ★
          tr '\n' ' ' < bsky.code 2>/dev/null || echo "code-none"
          if grep -qv '=0$' bsky.code 2>/dev/null; then echo "ng"; else echo "ok"; fi

      - name: 記録を持ち帰る
        if: always()
        env:
          GH: ${{ secrets.SRC_TOKEN }}
        run: |
          set +e   # ★これが無いと0以外を返した時点で段階が終わる★
          cd work/scripts/manga
          for f in sns_posted.json follow_state.json reply_state.json \
                   bsky_posted.json bsky_session.json bsky_hours.json \
                   hatena_posted.json hatena_series_done.json \
                   hatena_seo.json like_score.json; do
            cp -f $f ../../data/manga/ 2>/dev/null || true
          done
          # ★失敗の中身は非公開側の記録へ★ 公開側には出さない
          # ★★★ ログは checkout の後に置く ★★★（2026-09-19）
          #   ■AIへ■ 前は runlog/ に書いてから `git checkout -- .` で全部戻していたので、
          #     bsky.txt / bsky.code が毎回消え、9/9から一度も保存されていなかった。
          #     「なぜ投稿しなかったか」を誰も見られない状態だった。
          #     順番：控えを /tmp に逃がす → checkout → pull → 控えとログを戻す → add。
          mkdir -p /tmp/keep /tmp/keeplog
          tail -c 60000 bsky.log > /tmp/keeplog/bsky.txt 2>/dev/null || true
          cp -f bsky.code /tmp/keeplog/bsky.code 2>/dev/null || true
          cd ..
          cd ..
          git config user.name "duck"
          git config user.email "duck@imadake.local"
          cp -f data/manga/*.json /tmp/keep/ > /dev/null 2>&1 || true
          git checkout -- . > /dev/null 2>&1 || true
          git pull --rebase -q origin main > /dev/null 2>&1 || true
          cp -f /tmp/keep/*.json data/manga/ > /dev/null 2>&1 || true
          mkdir -p runlog
          cp -f /tmp/keeplog/bsky.txt runlog/bsky.txt > /dev/null 2>&1 || true
          cp -f /tmp/keeplog/bsky.code runlog/bsky.code > /dev/null 2>&1 || true
          git add data/manga/ runlog/ > /dev/null 2>&1 || true
          git diff --cached --quiet || git commit -q -m "bsky: $(date +%F_%H%M)" > /dev/null 2>&1 || true
          git push -q "https://x-access-token:${GH}@github.com/hoshiyomi-luna/uranai-luna.git" HEAD:main > /dev/null 2>&1 \
            && echo "ok" || echo "check"
